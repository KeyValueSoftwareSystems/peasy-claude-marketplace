button:hover{border-color:var(--accent)}

.pct{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:700}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none}

.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 2px 12px rgba(23,25,43,.12);border-radius:6px;overflow:hidden}
.hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;background:var(--bar);color:var(--fg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
