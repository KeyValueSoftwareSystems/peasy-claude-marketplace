name: Release
# Push a tag like v1.0.0 → builds dist/*.plugin and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: ./scripts/package.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/*.plugin --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
