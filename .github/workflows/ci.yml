name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: python3 plugins/peasy-brainstormer/skills/peasy-brainstormer/assets/prd/prd_lint.py plugins/peasy-brainstormer/skills/peasy-brainstormer/assets/prd/example-prd.json
